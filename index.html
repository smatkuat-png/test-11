<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-сынып Информатика: HTML Тест</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .question {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .question p {
            font-weight: bold;
        }
        label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HTML пәнінен тест</h1>
    <form id="quizForm">
        
        <!-- 1 сұрақ -->
        <div class="question">
            <p>1. HTML қысқартылған сөзінің дұрыс мағынасы қандай?</p>
            <label><input type="radio" name="q1" value="a"> A) Hyper Text Markup Language</label>
            <label><input type="radio" name="q1" value="b"> B) High Tech Modern Language</label>
            <label><input type="radio" name="q1" value="c"> C) Hyper Transfer Text Language</label>
        </div>

        <!-- 2 сұрақ -->
        <div class="question">
            <p>2. Веб-беттің ең үлкен тақырыбын (заголовком) қай тег анықтайды?</p>
            <label><input type="radio" name="q2" value="a"> A) &lt;head&gt;</label>
            <label><input type="radio" name="q2" value="b"> B) &lt;h1&gt;</label>
            <label><input type="radio" name="q2" value="c"> C) &lt;heading&gt;</label>
        </div>

        <!-- 3 сұрақ -->
        <div class="question">
            <p>3. Гиперсілтеме жасау үшін қандай тег қолданылады?</p>
            <label><input type="radio" name="q3" value="a"> A) &lt;link&gt;</label>
            <label><input type="radio" name="q3" value="b"> B) &lt;href&gt;</label>
            <label><input type="radio" name="q3" value="c"> C) &lt;a&gt;</label>
        </div>

        <!-- 4 сұрақ -->
        <div class="question">
            <p>4. Суретті кірістіру үшін қандай тег қолданылады?</p>
            <label><input type="radio" name="q4" value="a"> A) &lt;image&gt;</label>
            <label><input type="radio" name="q4" value="b"> B) &lt;img&gt;</label>
            <label><input type="radio" name="q4" value="c"> C) &lt;pic&gt;</label>
        </div>

        <!-- 5 сұрақ -->
        <div class="question">
            <p>5. Реттелмеген (маркерленген) тізімді жасау тегі қандай?</p>
            <label><input type="radio" name="q5" value="a"> A) &lt;ol&gt;</label>
            <label><input type="radio" name="q5" value="b"> B) &lt;ul&gt;</label>
            <label><input type="radio" name="q5" value="c"> C) &lt;list&gt;</label>
        </div>

        <button type="button" onclick="checkAnswers()">Нәтижені көру</button>
    </form>

    <div id="result"></div>
</div>

<script>
    function checkAnswers() {
        const answers = {
            q1: 'a',
            q2: 'b',
            q3: 'c',
            q4: 'b',
            q5: 'b'
        };

        let score = 0;
        let total = 5;

        for (let key in answers) {
            let userAns = document.querySelector(`input[name="${key}"]:checked`);
            if (userAns && userAns.value === answers[key]) {
                score++;
            }
        }

        document.getElementById('result').innerText = `Сіздің нәтижеңіз: ${score} / ${total}`;
    }
</script>

</body>
</html>
